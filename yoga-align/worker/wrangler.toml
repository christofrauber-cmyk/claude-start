name = "yoga-pose-classifier"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://christofrauber-cmyk.github.io,http://localhost:5173"
MODEL = "accurate"

# 30 requests per minute and IP. Covers a sequence of ~20 poses in one go.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Secret, set once with: npx wrangler secret put ANTHROPIC_API_KEY
