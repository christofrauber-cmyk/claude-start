# Builds the website plus the yoga app and publishes both to the gh-pages branch.
# One-time setup: Settings → Pages → "Deploy from a branch" → gh-pages / (root).
# Result: website at /, yoga app at /yoga/.
name: Publish to GitHub Pages

on:
  push:
    branches: [claude/sleepy-pasteur-ixqbev, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yoga-align/package-lock.json
      - name: Build yoga app
        working-directory: yoga-align
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site
        run: |
          mkdir -p site/yoga
          cp index.html site/
          cp -r yoga-align/dist/. site/yoga/
          touch site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
